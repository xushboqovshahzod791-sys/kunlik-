<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktiv Test Tizimi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 650px;
            padding: 30px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .hidden {
            display: none !important;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Form Uslubi */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: #667eea;
            outline: none;
        }

        /* Taymer va Panel */
        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f7fafc;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .timer {
            color: #e53e3e;
            font-size: 18px;
        }

        /* Savollar Oynasi (Scroll qilish uchun) */
        #quizForm {
            overflow-y: auto;
            padding-right: 5px;
            flex-grow: 1;
            margin-bottom: 15px;
        }

        /* Savollar Uslubi */
        .question-card {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #edf2f7;
        }

        .question-title {
            font-size: 18px;
            color: #2d3748;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .option-label:hover {
            background: #edf2f7;
        }

        .option-label input {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* Tugmalar */
        .btn {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            flex-shrink: 0;
        }

        .btn:hover {
            background: #5a67d8;
        }

        /* Natija paneli */
        .result-box {
            text-align: center;
        }

        .result-box h3 {
            margin-bottom: 15px;
            color: #2b6cb0;
        }

        .result-item {
            font-size: 18px;
            margin: 10px 0;
            padding: 12px;
            background: #f7fafc;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- 1-BOSQICH: Ro'yxatdan o'tish -->
        <div id="startScreen">
            <h2>Testni boshlash</h2>
            <form id="regForm">
                <div class="form-group">
                    <label for="fullname">Ism va Familiya</label>
                    <input type="text" id="fullname" placeholder="Masalan: Ali Valiyev" required>
                </div>
                <div class="form-group">
                    <label for="phone">Telefon raqam</label>
                    <input type="tel" id="phone" placeholder="+998 90 123 45 67" required>
                </div>
                <button type="submit" class="btn">Testni boshlash (5 daqiqa)</button>
            </form>
        </div>

        <!-- 2-BOSQICH: Test Jarayoni -->
        <div id="quizScreen" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
            <div class="header-panel">
                <span id="userNameDisplay"></span>
                <span class="timer">Vaqt: <span id="timeDisplay">05:00</span></span>
            </div>
            <form id="quizForm">
                <div id="questionsContainer"></div>
            </form>
            <button type="button" id="submitBtn" class="btn">Testni yakunlash</button>
        </div>

        <!-- 3-BOSQICH: Natija -->
        <div id="resultScreen" class="hidden">
            <div class="result-box">
                <h2>Test Natijasi</h2>
                <h3 id="resultUser"></h3>
                <div class="result-item" style="color: #2f855a;">✅ To'g'ri javoblar: <span id="correctCount">0</span> ta</div>
                <div class="result-item" style="color: #c53030;">❌ Noto'g'ri javoblar: <span id="wrongCount">0</span> ta</div>
                <div class="result-item" style="color: #d69e2e;">⚠️ Belgilanmagan: <span id="unansweredCount">0</span> ta</div>
                <button onclick="location.reload()" class="btn" style="margin-top: 20px;">Qayta topshirish</button>
            </div>
        </div>
    </div>

    <script>
        // Kengaytirilgan va ko'paytirilgan savollar ro'yxati
        const savolar = [
            { id: 1, text: '2 x 2 = ?', javoblar: [3, 4, 5, 6], tj: 4 },
            { id: 2, text: '4 x 9 = ?', javoblar: [25, 30, 36, 32], tj: 36 },
            { id: 3, text: '11 x 9 = ?', javoblar: [99, 30, 36, 32], tj: 99 },
            { id: 4, text: 'Bir yilda nechta fasl bor?', javoblar: [3, 5, 2, 4], tj: 4 },
            { id: 5, text: 'Suv necha gradusda qaynaydi?', javoblar: [101, 99, 100, 105], tj: 100 },
            { id: 6, text: 'O\'zbekiston poytaxti qaysi shahar?', javoblar: [ 'Samarqand', 'Toshkent', 'Buxoro', 'Farg\'ona'], tj: 'Toshkent' },
            { id: 7, text: '12 ning kvadrati nechiga teng?', javoblar: [124, 144, 132, 112], tj: 144 },
            { id: 8, text: 'Inson tanasida nechta asosiy qon guruhi mavjud?', javoblar: [2, 3, 4, 5], tj: 4 },
            { id: 9, text: 'Eng kichik tub son qaysi?', javoblar: [0, 1, 2, 3], tj: 2 },
            { id: 10, text: 'Dunyodagi eng katta okean qaysi?', javoblar: [ 'Tinch okeani', 'Atlantika okeani', 'Hind okeani', 'Shimoliy Muz okeani'], tj: 'Tinch okeani' },
            { id: 11, text: '1 soatda necha soniya bor?', javoblar: [3600, 600, 1800, 7200], tj: 3600 },
            { id: 12, text: 'Quyosh tizimidagi eng katta sayyora qaysi?', javoblar: [ 'Zuhal', 'Mars', 'Yupiter', 'Yer'], tj: 'Yupiter' },
            { id: 13, text: 'Al-Xorazmiy qaysi fanning asoschisi hisoblanadi?', javoblar: [ 'Fizika', 'Algebra', 'Kimyo', 'Biologiya'], tj: 'Algebra' },
            { id: 14, text: 'O\'zbekiston Respublikasining davlat madhiyasi qachon qabul qilingan?', javoblar: [ '1991-yil', '1992-yil', '1993-yil', '1994-yil'], tj: '1992-yil' },
            { id: 15, text: '100 ning 5 foizi nechiga teng?', javoblar: [5, 10, 50, 0.5], tj: 5 }
        ];

        let foydalanuvchi = { fullname: '', phone: '' };
        let foydalanuvchiJavoblari = {};
        let vaqtSonya = 5 * 60; // 5 daqiqa
        let timerInterval;

        const startScreen = document.getElementById('startScreen');
        const quizScreen = document.getElementById('quizScreen');
        const resultScreen = document.getElementById('resultScreen');
        const regForm = document.getElementById('regForm');
        const questionsContainer = document.getElementById('questionsContainer');
        const submitBtn = document.getElementById('submitBtn');

        regForm.addEventListener('submit', (e) => {
            e.preventDefault();
            foydalanuvchi.fullname = document.getElementById('fullname').value;
            foydalanuvchi.phone = document.getElementById('phone').value;

            startScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            document.getElementById('userNameDisplay').innerText = foydalanuvchi.fullname;

            renderSavolar();
            startTimer();
        });

        function renderSavolar() {
            questionsContainer.innerHTML = '';
            savolar.forEach((savol, sIndex) => {
                const qCard = document.createElement('div');
                qCard.className = 'question-card';

                const title = document.createElement('div');
                title.className = 'question-title';
                title.innerText = `${sIndex + 1}. ${savol.text}`;
                qCard.appendChild(title);

                savol.javoblar.forEach(javob => {
                    const label = document.createElement('label');
                    label.className = 'option-label';

                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `savol_${savol.id}`;
                    input.value = javob;
                    input.dataset.savolId = savol.id;

                    input.addEventListener('change', () => {
                        foydalanuvchiJavoblari[savol.id] = javob;
                    });

                    label.appendChild(input);
                    label.appendChild(document.createTextNode(` ${javob}`));
                    qCard.appendChild(label);
                });

                questionsContainer.appendChild(qCard);
            });
        }

        function startTimer() {
            const timeDisplay = document.getElementById('timeDisplay');
            timerInterval = setInterval(() => {
                let daqiqa = Math.floor(vaqtSonya / 60);
                let soniya = vaqtSonya % 60;

                daqiqa = daqiqa < 10 ? '0' + daqiqa : daqiqa;
                soniya = soniya < 10 ? '0' + soniya : soniya;

                timeDisplay.innerText = `${daqiqa}:${soniya}`;

                if (vaqtSonya <= 0) {
                    clearInterval(timerInterval);
                    finishQuiz();
                }
                vaqtSonya--;
            }, 1000);
        }

        submitBtn.addEventListener('click', finishQuiz);

        function finishQuiz() {
            clearInterval(timerInterval);

            let togri = 0;
            let notogri = 0;

            savolar.forEach(savol => {
                const tanlangan = foydalanuvchiJavoblari[savol.id];
                if (tanlangan !== undefined) {
                    // String va Number taqqoslanishi xato bermasligi uchun ikkalasini ham solishtiramiz
                    if (String(tanlangan) === String(savol.tj)) {
                        togri++;
                    } else {
                        notogri++;
                    }
                }
            });

            const javobBerilmagan = savolar.length - (togri + notogri);

            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');

            document.getElementById('resultUser').innerText = `${foydalanuvchi.fullname} (${foydalanuvchi.phone})`;
            document.getElementById('correctCount').innerText = togri;
            document.getElementById('wrongCount').innerText = notogri;
            document.getElementById('unansweredCount').innerText = javobBerilmagan;
        }
    </script>
</body>
</html>
